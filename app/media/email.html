<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
   "http://www.w3.org/TR/html4/loose.dtd">
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="initial-scale=1.0">    <!-- So that mobile webkit will display zoomed in -->
    <meta name="format-detection" content="telephone=no"> <!-- disable auto telephone linking in iOS -->

    <title>{{ title }}</title>
    <style type="text/css">

        /* Resets: see reset.css for details */
        .ReadMsgBody { width: 100%; background-color: #ebebeb;}
        .ExternalClass {width: 100%; background-color: #ebebeb;}
        .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div {line-height:100%;}
        body {-webkit-text-size-adjust:none; -ms-text-size-adjust:none;}
        body {margin:0; padding:0;}
        table {border-spacing:0;}
        table td {border-collapse:collapse;}
        .yshortcuts a {border-bottom: none !important;}


        /* Constrain email width for small screens */
        @media screen and (max-width: 600px) {
            table[class="container"] {
                width: 95% !important;
            }
        }

        /* Give content more room on mobile */
        @media screen and (max-width: 480px) {
            td[class="container-padding"] {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
         }

        /* styles for the medical table*/
        .medical-visit-table {
          width: 100%;
          border-collapse: collapse;
        }
        .medical_visit_table {
          overflow: auto;
          width: 100%;
        }

        .medical_visit_table table {
          border: 4px solid #e6e6e6;
          height: 98%;
          width: 100%;
          table-layout: auto;
          border-collapse: collapse;
          border-spacing: 1px;
          text-align: left;
        }

        .medical_visit_table caption {
          caption-side: top;
          text-align: left;
        }

        .medical_visit_table th {
          border: 4px solid #e6e6e6;
          background-color: #eceff1;
          color: #000000;
          padding: 10px;
        }

        .medical_visit_table td {
          border: 4px solid #e6e6e6;
          padding: 10px;
        }

        .medical_visit_table tr:nth-child(even) td {
          background-color: #ffffff;
          color: #000000;
        }

        .medical_visit_table tr:nth-child(odd) td {
          background-color: #d6d6d6;
          color: #000000;
        }
        .text-bold {
          font-weight: bold;
        }

                /* styles for the payment table*/
        .payments-table {
          width: 100%;
          border-collapse: collapse;
        }
        .payments_table {
          overflow: auto;
          width: 100%;
        }

        .payments_table table {
          border: 4px solid #e6e6e6;
          height: 98%;
          width: 100%;
          table-layout: auto;
          border-collapse: collapse;
          border-spacing: 1px;
          text-align: left;
        }

        .payments_table caption {
          caption-side: top;
          text-align: left;
        }

        .payments_table th {
          border: 4px solid #e6e6e6;
          background-color: #eceff1;
          color: #000000;
          padding: 10px;
        }

        .payments_table td {
          border: 4px solid #e6e6e6;
          padding: 10px;
        }

        .payments_table tr:nth-child(even) td {
          background-color: #ffffff;
          color: #000000;
        }

        .payments_table tr:nth-child(odd) td {
          background-color: #d6d6d6;
          color: #000000;
        }


    </style>
</head>
<body style="margin:0; padding:10px 0;" bgcolor="#ebebeb">

<br>

<!-- 100% wrapper (grey background) -->
<table style="height: 100%" border="0" width="100%" cellpadding="0" cellspacing="0" bgcolor="#393E4C">
  <tr>
    <td align="center" valign="top" bgcolor="#ebebeb" style="background-color: #393E4C;">
      <br />
      <img src="https://api.lytcamp.com.mx/media/assets/logos/logo-lyt-white.png" border="0" class="editable" style="display:block;margin-left:auto;margin-right:auto;max-width: 10%;">

      <!-- 600px container (white background) -->
      <table border="0" width="600" cellpadding="0" cellspacing="0" class="container" bgcolor="#ffffff">
        <tr>
          <td class="container-padding" bgcolor="#ffffff" style="background-color: #ffffff; padding-left: 30px; padding-right: 30px; font-size: 14px; line-height: 20px; font-family: Helvetica, sans-serif; color: #333;">
            <br>

            <!-- ### BEGIN CONTENT ### -->
            {{ content }}
            <br><br>

            <em style="font-style:italic; font-size: 12px; color: #aaa;"><a href="https://lytcamp.com.mx">Lago y Tierra</a>&copy;</em>
            <br><br>

            <!-- ### END CONTENT ### -->

          </td>
        </tr>
      </table>
      <!--/600px container -->

    </td>
  </tr>
</table>
<!--/100% wrapper-->
<br>
<br>
</body>
</html>
