<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style type="text/css"> 
        BODY{ 
            font-family: Arial;
            } 
        @page { 
            size: 8.5in 11in;
            margin: 0mm 0mm 0mm 0mm;
            }
        td.bracelete {
            width: 1in;
            height: 11in;
            overflow: hidden;
            display: inline-flex;
            /* white-space: nowrap; */
            border: 1px solid #000000; 
            align-items: center;
            justify-content: center;
        }
        p.name {
            font-size: 12px;
            text-align: center;
        }
        p.sub_text{
            font-size: 10px;
            text-align: center;
        }
        p.sub_text_minor{
            font-size: 7px;
            text-align: center;
            font-weight: bold;
        }
        p.calibrador{
            font-size: 2px;
            text-align: center;
            font-weight: bold;
        }
        .barcode{
            /* transform: rotate(-0.25turn);
            height: 90%;
            width: 90%; */
            /* border: 1px solid #000000; */
            height: 150px;
        }
        img.barcode_img{
            transform: rotate(-0.25turn);
            width: 190%;
            height: 45%;
        }
        figcaption{
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, .2);
            padding: 0px;
        }
        .logo{
            /* border: 1px solid #000000; */
            height: 80px;
        }
        img.img_logo{
            width: 100%;
        }
        td.center{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        p.rotate{
            transform: rotate(-0.25turn);
            padding: 0;
            font-size: 12px;
        }
        </style>
    </head>

    <body style="text-align:center;" >  
        <div style="width: 100%;  justify-items: center; display: inline-flex; align-items: center;">
        
            <table style="width: 100%; height: 11in;" >
                <tbody>
                    <tr>
                        {%for i in list_bracelet%}
                        <td class = "bracelete" style="width: 1in;">
                            <div class="bodyBracelete">
                                <p class = "name">
                                    {{i.name}}
                                </p>
                                <p class="sub_text">
                                    Escuela<br>
                                    {{i.school}}<br>
                                    <br>
                                    Campamento
                                    {{i.camping}}
                                </p>
                                <div class="barcode" style="width: 100%;">
                                    <table border="0" style="width: 100%;">
                                        <tbody>
                                            <tr>
                                                <td style="width: 80%; height: 140px;" class = "center">
                                                    <img class = "barcode_img" src="{{i.barcode_img}}" >
                                                </td>
                                                <td style="width: 20%; height: 140px;" class="center">
                                                    <p class="rotate">{{i.barcode_code}}</p>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <p class="sub_text">
                                    Tipo de sangre<br>
                                    {{i.blood_type}}<br>
                                    <br>
                                    Alergias <br>
                                    {{i.alergies}}<br> 
                                    <br>
                                    Otras alergias <br>
                                    {{i.other_alergies}}<br>
                                    <br>
                                    Comida Prohibida <br>
                                    {{i.prohibed_food}}
                                </p>
                                <br>
                                <div class = "logo" >
                                    <img class="img_logo" src="{{i.logo_img}}" >
                                </div>
                                <!-- <p class="sub_text_minor">
                                    En caso de emergencia o <br> 
                                    extravío favor de <br>
                                    comunicarse al <br>
                                    55·2574·937 ó <br> 
                                    01·800·700·2267 <br> 
                                    KinCamp <br> 
                                    http://www.kincamp.com
                                </p> -->
                                <br>
                                <p class="calibrador">
                                    M(1) L(1)
                                </p>
                            </div>
                        </td>
                        {% endfor %}
                    </tr>
                </tbody>
            </table>
        
        </div>
        

    </body>
