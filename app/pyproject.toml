[tool.poetry]
name = "camping-control"
version = "0.1.0"
description = ""
authors = ["Jorge"]
readme = "README.md"
packages = [{include = "camping_control"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.95.0"
uvicorn = "^0.21.1"
python-dotenv = "^1.0.0"
alembic = "^1.10.2"
sqlalchemy = "^2.0.8"
psycopg2-binary = "^2.9.6"
pydantic = {extras = ["email"], version = "^1.10.7"}
python-multipart = "^0.0.6"
pandas = "^2.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
openpyxl = "^3.1.2"
reportlab = "3.6.12"
requests = "^2.28.2"
aiofiles = "^23.1.0"
pillow = "^9.5.0"
pdfkit = "^1.0.0"
jinja2 = "^3.1.2"
python-barcode = "^0.14.0"
code128 = "^0.3"
pypdf2 = "^3.0.1"
mercadopago = "^2.3.0"
fastapi-pagination = "^0.13.0"
httpx = "^0.28.1"
apscheduler = "^3.11.0"
boto3 = "^1.43.100"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
